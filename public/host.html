<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Milli Teknoloji Bilgi Yarışı · Sunucu Ekranı</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="host">
<div class="banner" id="kopuk" hidden>Sunucu bağlantısı koptu, yeniden bağlanılıyor…</div>
<main id="app"></main>
<script src="/qrcode.js"></script>
<script src="/avatar.js"></script>
<script>
// Sunucu (büyük) ekranı: lobi, soru, sonuç ve kürsü. Öğretmen buradan yönetir.
const app = document.getElementById('app'), kopuk = document.getElementById('kopuk');
const KEY = new URLSearchParams(location.search).get('key') || '';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n.toLocaleString('tr-TR');
const HARF = ['A','B','C','D'];
const UCAK = '<svg class="plane" id="plane" viewBox="0 0 34 34" aria-hidden="true"><path d="M31 17 20 13 13 4h-3l3 9H7l-3-3H2l2 7-2 7h2l3-3h6l-3 9h3l7-9 11-4z" fill="#FFFFFF"/></svg>';
let D = null, anahtar = '', raf = 0, ses = true, actx = null;

function bip(f, d=0.12, tip='triangle'){
  if(!ses) return;
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(); o.type = tip; o.frequency.value = f; g.gain.value = 0.08;
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + d); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
  }catch(e){}
}
const gonder = veri => fetch('/api/host', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({...veri, key:KEY})}).catch(() => {});
function ciz(html){ cancelAnimationFrame(raf); app.innerHTML = html; }
function qrSvg(url){ try{ const q = qrcode(0, 'M'); q.addData(url); q.make(); return q.createSvgTag({cellSize:6, margin:2, scalable:true}); }catch(e){ return ''; } }

const es = new EventSource('/akis?rol=host&key=' + encodeURIComponent(KEY));
es.onopen = () => kopuk.hidden = true;
es.onerror = () => kopuk.hidden = false;
es.onmessage = e => { const d = JSON.parse(e.data); d.alindi = performance.now();
  const onceki = D && D.faz + (D.soru ? D.soru.no : ''); D = d;
  if(d.faz === 'yetkisiz'){ es.close(); return ciz('<div class="panel center grow"><h1>Bu ekran yalnızca öğretmen bilgisayarından açılır</h1><p class="muted">Başka cihazdan açmak için terminalde yazan anahtarlı adresi kullanın.</p></div>'); }
  const simdi = d.faz + (d.soru ? d.soru.no : '');
  if(simdi !== onceki){ if(d.faz === 'tanit') bip(440); if(d.faz === 'sonuc'){ bip(660); setTimeout(() => bip(990, .18), 110); }
    if(d.faz === 'final') [523,659,784,1047].forEach((f,i) => setTimeout(() => bip(f, .2), i*140)); }
  durumCiz();
};

function durumCiz(){
  const k = JSON.stringify({...D, kalanMs:0, alindi:0});
  if(k === anahtar) return; anahtar = k;
  const s = D.soru, n = D.oyuncular.length;
  const hud = s ? `<div class="hud"><span>Soru <span class="num">${s.no}/${s.toplam}</span></span><span class="cat">${esc(s.k)}</span><span class="num">${n} oyuncu</span></div>` : '';

  if(D.faz === 'lobi'){
    const ip = D.adresler[0], url = ip ? `http://${ip}:${D.port}` : '';
    const seg = (ad, deger, liste, ek) => `<div class="seg">${liste.map(v => `<button data-act="ayar" data-ad="${ad}" data-v="${v}" aria-pressed="${deger===v}">${v}${ek}</button>`).join('')}</div>`;
    return ciz(`<div class="row between"><h1>Milli Teknoloji <em>Bilgi Yarışı</em></h1><button class="ghost" data-act="ses">Ses: ${ses?'Açık':'Kapalı'}</button></div>
      <div class="lobi">
        <div class="panel center">
          ${url ? `<div class="eyebrow">1 · Tabletinden bu adresi aç</div><div class="url">${esc(url.replace('http://',''))}</div>
            <div class="qr">${qrSvg(url + '/?pin=' + D.pin)}</div><p class="muted">ya da kamerayla kare kodu okut</p>`
            : `<p class="err">Wi-Fi adresi bulunamadı. Bu bilgisayarı tabletlerle aynı ağa bağlayın.</p>`}
          <div class="eyebrow">2 · PIN'i yaz</div><div class="pin num">${D.pin.slice(0,3)} ${D.pin.slice(3)}</div>
        </div>
        <div class="panel">
          <div class="row between"><div class="legend">Oyuncular</div><div class="legend num">${n} / ${D.maks}</div></div>
          <div class="chips grow">${n ? D.oyuncular.map(o => `<button class="chip ${o.bagli?'':'off'}" data-act="cikar" data-id="${o.id}" title="Oyundan çıkarmak için tıkla">${AVATAR.html(o.av, 30)}${esc(o.ad)}</button>`).join('')
            : '<p class="muted">Henüz kimse katılmadı. Katılanların adı burada belirir.</p>'}</div>
          ${n ? '<p class="muted" style="font-size:.85rem">Bir ismi oyundan çıkarmak için üstüne tıklayın.</p>' : ''}
          <div class="row"><div><div class="legend">Soru sayısı</div>${seg('adet', D.ayar.adet, [10,15,20], '')}</div>
            <div><div class="legend">Soru süresi</div>${seg('sure', D.ayar.sure, [15,20,30], ' sn')}</div></div>
          <button class="go" data-act="basla" ${n ? '' : 'disabled'}>Yarışı başlat</button>
        </div>
      </div>`);
  }

  if(D.faz === 'tanit') return ciz(`${hud}<div class="panel center grow pop"><div class="eyebrow">${esc(s.k)}</div>
    <div class="big">Soru ${s.no}<span class="muted"> / ${s.toplam}</span></div><p class="muted">Hazır olun!</p></div>`);

  if(D.faz === 'soru'){
    const cevap = D.oyuncular.filter(o => o.cevapladi).length;
    ciz(`${hud}<h2 class="q pop">${esc(s.q)}</h2>
      <div class="timer"><div class="runway">${UCAK}</div><div class="secs num" id="secs"></div></div>
      <div class="tiles">${s.siklar.map((t,i) => `<button class="tile t${i+1}" disabled><span class="key">${HARF[i]}</span><span class="txt">${esc(t)}</span></button>`).join('')}</div>
      <div class="row between"><div class="chips">${D.oyuncular.map(o => `<span class="chip ${o.cevapladi?'done':''} ${o.bagli?'':'off'}" style="animation:none">${AVATAR.html(o.av, 24)}${esc(o.ad)}</span>`).join('')}</div>
        <div class="row"><b class="num">${cevap} / ${n} cevap</b><button class="ghost" data-act="atla">Süreyi bitir</button></div></div>`);
    return saat();
  }

  if(D.faz === 'sonuc'){ const r = D.sonuc, enCok = Math.max(1, ...r.sayilar), son = s.no === s.toplam;
    return ciz(`${hud}<h2 class="q small">${esc(s.q)}</h2>
      <div class="tiles" style="flex:none">${s.siklar.map((t,i) => `<button class="tile t${i+1} ${i===r.dogru?'':'dim'}" disabled><span class="fill" style="width:${r.sayilar[i]/enCok*100}%"></span>
        <span class="key">${HARF[i]}</span><span class="txt">${esc(t)}</span><span class="cnt num">${i===r.dogru?'✓ ':''}${r.sayilar[i]}</span></button>`).join('')}</div>
      <div class="fact"><b>Biliyor muydun?</b>${esc(r.bilgi)}</div>
      <ol class="board two">${D.oyuncular.slice(0, 6).map((o,i) => `<li><span class="num">${i+1}.</span><span class="nm">${AVATAR.html(o.av, 30)}${esc(o.ad)}</span>
        <span class="gain ${o.ok?'ok':'no'}">${o.ok ? '+'+fmt(o.kazanc) : '—'}</span><span class="num">${fmt(o.puan)}</span></li>`).join('')}</ol>
      <div class="row between"><span class="muted">${n > 6 ? `İlk 6 gösteriliyor · toplam ${n} oyuncu` : ''}</span>
        <button class="go" data-act="ileri">${son ? 'Sonuçları göster' : 'Sonraki soru'}</button></div>`); }

  if(D.faz === 'final'){ const L = D.oyuncular, yer = [L[1], L[0], L[2]], cls = ['p2','p1','p3'], no = [2,1,3];
    return ciz(`<div class="panel center"><div class="eyebrow">Yarış bitti</div><div class="big">${L[0] ? 'Kazanan: ' + esc(L[0].ad) : 'Oyuncu yok'}</div>
        <div class="podium">${yer.map((o,i) => o ? `<div class="step ${cls[i]}">${AVATAR.html(o.av, 72)}<span class="nm">${esc(o.ad)}</span><span class="num">${fmt(o.puan)}</span><div class="bar">${no[i]}</div></div>` : '').join('')}</div></div>
      <ol class="board two">${L.map((o,i) => `<li><span class="num">${i+1}.</span><span class="nm">${AVATAR.html(o.av, 30)}${esc(o.ad)}</span>
        <span class="gain">${o.dogru}/${s ? s.toplam : 0} doğru</span><span class="num">${fmt(o.puan)}</span></li>`).join('')}</ol>
      <div class="row"><button class="go" data-act="tekrar">Aynı oyuncularla tekrar</button><button class="ghost" data-act="yeni">Yeni oyun (yeni PIN)</button></div>`); }
}

function saat(){
  const plane = document.getElementById('plane'), secs = document.getElementById('secs');
  const bitis = D.alindi + D.kalanMs, toplam = D.ayar.sure * 1000; let sonSn = -1;
  const tik = () => {
    const kalan = Math.max(0, bitis - performance.now()), oran = 1 - kalan/toplam, sn = Math.ceil(kalan/1000);
    plane.style.left = `calc(${oran*100}% - ${oran*30}px)`;
    if(sn !== sonSn){ if(sonSn !== -1 && sn <= 5 && sn > 0) bip(880, .06, 'square'); sonSn = sn; secs.textContent = sn; }
    if(kalan > 0) raf = requestAnimationFrame(tik);
  };
  tik();
}

let sonDokunma = 0;
function islem(e){
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  if(e.type === 'click' && performance.now() - sonDokunma < 500) return;
  if(e.type === 'pointerdown') sonDokunma = performance.now();
  const a = b.dataset.act;
  if(a === 'ses'){ ses = !ses; anahtar = ''; return durumCiz(); }
  if(a === 'ayar') return gonder({islem:'ayar', [b.dataset.ad]: +b.dataset.v});
  if(a === 'cikar') return gonder({islem:'cikar', id:b.dataset.id});
  gonder({islem:a});
}
app.addEventListener('pointerdown', islem); app.addEventListener('click', islem);
</script>
</body>
</html>
